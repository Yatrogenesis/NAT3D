[package]
name = "nat3d-physics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Physics simulation for NAT3D - rigid bodies, soft bodies, cloth, fluids (Navier-Stokes), particles"
keywords = ["physics", "simulation", "navier-stokes", "fluids", "particles"]
categories = ["simulation", "science", "game-development"]

[dependencies]
# Internal
nat3d-core = { workspace = true }
nat3d-math = { workspace = true }

# yatrosci
yatrosci-core   = { workspace = true }
yatrosci-linalg = { workspace = true }

# Mathematics
nalgebra = { workspace = true }
glam = { workspace = true }
ndarray = { workspace = true }
num-traits = { workspace = true }

# Parallelism
rayon = { workspace = true }
crossbeam = { workspace = true }
parking_lot = { workspace = true }

# Random number generation
rand = { workspace = true }

# WASM: flips on getrandom 0.3's "wasm_js" feature for the whole build — see
# the `getrandom03` comment in the workspace root Cargo.toml. That feature
# alone isn't enough for getrandom 0.3; a matching rustc --cfg flag is also
# needed, set in .cargo/config.toml.
getrandom03 = { workspace = true }

# Serialization
serde = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "physics_bench"
harness = false

[[bench]]
name = "navier_stokes_bench"
harness = false

[lints]
workspace = true
