[package]
name = "nat3d-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Main application for NAT3D - desktop GUI application"
keywords = ["application", "3d", "modeling", "cad"]
categories = ["graphics", "gui"]

[dependencies]
# Internal crates
nat3d-core = { workspace = true }
nat3d-math = { workspace = true }
nat3d-physics = { workspace = true }
nat3d-render = { workspace = true }
nat3d-ui = { workspace = true }
nat3d-modeling = { workspace = true }
nat3d-animation = { workspace = true }
nat3d-io = { workspace = true }
# default-features = false is load-bearing: nat3d-scripting enables its
# python feature by default, which pulls in PyO3 and makes the link step
# require libpython. Without this, the python feature of this crate cannot
# actually be turned off, and any target without a libpython for its
# architecture fails to link. That is what broke every Android build, where
# no libpython for aarch64-linux-android exists on the runner.
nat3d-scripting = { workspace = true, default-features = false }

# GUI
eframe = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }

# Mathematics
nalgebra = { workspace = true }
uuid = { workspace = true }
# std::time::Instant/SystemTime panic on wasm32-unknown-unknown; see the
# web-time comment in the workspace root Cargo.toml.
web-time = { workspace = true }

# Async
pollster = { workspace = true }
parking_lot = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# File dialogs
rfd = { workspace = true, optional = true }
open = { workspace = true, optional = true }

# Image output
image = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Licensing (Ed25519 asymmetric verification)
sha2 = { workspace = true }
base32 = { workspace = true }
ed25519-dalek = { workspace = true }

# Desktop-only: the iPad remote-input listener (feature "ipad", cfg-gated in
# src/lib.rs) opens a TCP socket via tokio and speaks nat3d-sync's wire
# protocol; nat3d-cloud is likewise desktop-only sync/backup plumbing, not
# referenced from wasm32 code paths. None of the three build for
# wasm32-unknown-unknown (tokio's net/runtime backends assume OS sockets and
# threads that the browser target doesn't provide), so they are kept out of
# that target's dependency graph entirely rather than merely unused. The web
# build (crates/nat3d-web) depends on this crate with default-features =
# false, which also keeps the "ipad" feature off so the cfg-gated call sites
# that reference nat3d-sync/tokio are compiled out too.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nat3d-cloud = { workspace = true }
nat3d-sync = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Document",
    "Window",
    "Element",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "Storage",
    "Location",
    "console",
] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "nat3d-app"
path = "src/main.rs"

[package.metadata.wix]
eula = false

[features]
default = ["python", "file-dialog", "ipad"]
python = ["nat3d-scripting/python"]
ipad = ["nat3d-sync/ipad"]
file-dialog = ["dep:rfd", "dep:open"]
