#
# Compila el APK de NAT3D (crate `nat3d-mobile`) en GitHub Actions.
#
# POR QUE EN CI Y NO EN LOCAL:
#   El NDK de Android pesa varios GB y la maquina de desarrollo va justa de RAM
#   y de disco. Aqui el runner de GitHub aporta el NDK, la memoria y el disco,
#   y devuelve el .apk como artefacto descargable. No hay que instalar nada.
#
# QUE COMPILA:
#   `nat3d-mobile` — el unico crate del workspace preparado para Android
#   (declara `android-activity` con la feature `native-activity`,
#   `winit/android-native-activity`, `crate-type = ["cdylib","rlib"]`, y el
#   punto de entrada `android_main` en lib.rs:17). NO compila `nat3d-app`:
#   esa es la GUI de escritorio y no tiene punto de entrada Android.
#
# AVISO: produce un APK de release SIN FIRMAR. Instalable activando
#   "origenes desconocidos" en el telefono; NO subible a Play Store. Firmarlo
#   requiere un keystore, que es un secreto y una decision aparte.

name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  # Version del NDK en un solo sitio: la instala `sdkmanager` y la consume
  # `cargo-apk`. Si se cambia aqui, cambia en los dos usos.
  NDK_VERSION: 26.3.11579264

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # contents: write is needed by the step that attaches the APK to the
    # release. Without it that step fails with 403, Resource not accessible
    # by integration, while every earlier step succeeds, so the APK is built
    # and then dropped.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust + target Android
        uses: dtolnay/rust-toolchain@stable
        with:
          # arm64 cubre practicamente todo telefono desde ~2017.
          # Anadir armv7-linux-androideabi si hace falta soportar mas viejos.
          targets: aarch64-linux-android

      - name: JDK (lo exige el empaquetado de Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK + NDK de Android
        uses: android-actions/setup-android@v3

      - name: Instalar NDK y plataforma del SDK
        # cargo-apk necesita una plataforma del SDK ademas del NDK. Sin ella
        # falla con "Platform `30` is not installed", que es exactamente lo que
        # impidio que este workflow produjera un APK en todas sus ejecuciones
        # anteriores. La API 30 es la que cargo-apk toma por defecto cuando el
        # manifiesto no fija target_sdk_version.
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          sdkmanager --install "platforms;android-30"

      - name: Cachear dependencias de cargo
        uses: Swatinem/rust-cache@v2

      - name: Instalar cargo-apk
        run: cargo install cargo-apk --locked

      # cargo-apk refuses to build a release APK without a signing key, and
      # reads one from CARGO_APK_RELEASE_KEYSTORE. The key generated here is
      # deliberately throwaway: it is created fresh on every run, never stored,
      # and never reused.
      #
      # What that means for anyone installing the result, and it is not a
      # detail: the signature identifies nothing. It does not attest that the
      # file came from this project, and because a different key is generated
      # each time, an APK from one build cannot be installed over an APK from
      # another. Android will refuse the update and the previous install has to
      # be removed first. This is adequate for trying the application out and
      # inadequate for distributing it. Real distribution needs a persistent key
      # held as a repository secret, which is a decision with its own
      # consequences: lose that key and no future update to the app can ever be
      # published.
      - name: Generar clave de firma desechable
        run: |
          keytool -genkeypair -v \
            -keystore $RUNNER_TEMP/throwaway.keystore \
            -alias throwaway -keyalg RSA -keysize 2048 -validity 365 \
            -storepass throwaway -keypass throwaway \
            -dname 'CN=NAT3D throwaway build key, O=unverified, C=MX'
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/throwaway.keystore" >> $GITHUB_ENV
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=throwaway" >> $GITHUB_ENV

      - name: Construir APK
        # ANDROID_NDK_ROOT se exporta en el propio `run` y no en un bloque
        # `env:`, porque ahi no se puede referenciar el contexto `env` para
        # componer un valor a partir de ANDROID_HOME.
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          echo "NDK en: $ANDROID_NDK_ROOT"
          # --release is not cosmetic here. The first APK this workflow ever
          # produced was a debug build of 336 MB, fifty times the size of the
          # Windows installer for the same application, because debug builds
          # carry symbols and skip optimisation.
          cargo apk build --release -p nat3d-mobile --target aarch64-linux-android
          echo "--- APKs generados ---"
          find target -name '*.apk' -print

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: nat3d-android-apk
          path: target/**/*.apk
          if-no-files-found: error   # falla ruidosamente si no se genero nada
          retention-days: 30

      # Sin esto, el APK solo vivia como artefacto de Actions: requiere sesion
      # en GitHub para descargarlo y expira a los 30 dias — no aparecia en la
      # pagina publica de Releases junto al .msi/.dmg/.tar.gz. Lo renombramos
      # igual que los demas assets (`NAT3D-$tag-...`) y lo adjuntamos al
      # Release del mismo tag (release.yml lo crea como draft; softprops
      # actualiza ese mismo release si ya existe, o lo crea si esta accion
      # corre primero — no importa el orden entre los dos workflows).
      - name: Renombrar APK para el Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${{ github.ref_name }}"
          APK=$(find target -name '*.apk' | head -1)
          cp "$APK" "NAT3D-$TAG-android-arm64.apk"

      - name: Adjuntar APK al GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NAT3D-*-android-arm64.apk
          draft: true
          fail_on_unmatched_files: true
          append_body: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
